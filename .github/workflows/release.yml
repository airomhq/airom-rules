name: Release bundle

# Rule bundles are cut AUTOMATICALLY whenever a pack changes on main, so airom's
# product version never has to move for a rules change. The version auto-
# increments (patch) from the latest release. Fixture-only edits don't trigger a
# release (they don't change the bundle). workflow_dispatch can force a specific
# version, e.g. a minor bump for a big batch.
#
# airom fetches the three assets below from /releases/latest/download/ (or
# /releases/download/<tag>/ when pinned), verifies the ed25519 signature against
# its embedded public key, checks the tarball SHA-256 against the signed
# manifest, then extracts.

on:
  push:
    branches: [main]
    paths:
      - "rules/**/*.yaml"
      - "!rules/**/testdata/**"
      # Without this a catalog edit changes the bundle and never publishes —
      # and refreshing retirement dates without a scanner release is the reason
      # the lifecycle catalogs live in this repo at all.
      - "eol/**/*.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, e.g. v0.2.0 (blank = auto patch-bump)"
        required: false
        default: ""

permissions:
  contents: write # create the tag, release, and upload assets

env:
  # Pinned so the lint contract AND the benchmark numbers are reproducible:
  # "latest" would let an airom release change what this repo considers a
  # passing ruleset, with no commit here to explain it. Bump deliberately,
  # regenerating bench/baseline.json in the same commit if the numbers move.
  #
  # NOT named AIROM_VERSION: airom maps AIROM_* onto config keys and refuses to
  # start on an unrecognised one. Keep workflow variables out of that namespace.
  PINNED_AIROM_VERSION: "0.4.6"
  # The corpus commit the baseline was measured against. See the checkout step.
  BENCH_CORPUS_SHA: "93f1a230b119999190c98a6e9b9a55ea7f199769"

# Serialize releases so two quick pushes can't both compute the same next
# version; the second waits, then bumps from the tag the first created.
concurrency:
  group: release-bundle
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the tag history to compute the next version

      # A minor line resolved to its newest patch at run time. Without
      # check-latest, setup-go takes whatever patch the runner image has cached,
      # which lags go.dev by weeks — and this is the job that holds the signing
      # key, so its toolchain is the one place currency matters most. Go 1.25
      # went out of support, which is also why go.mod's floor moved to 1.26.
      # Standard-library security fixes arrive only as Go patch releases, and
      # Dependabot never proposes those.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      # Gate: never ship a bundle that fails airom's own validator. PRs are
      # already linted, but a direct push to main isn't — so re-check here.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate every pack and catalog before releasing
        run: |
          pip install "airom==${{ env.PINNED_AIROM_VERSION }}"
          fail=0
          while IFS= read -r pack; do
            airom rules lint "$pack" || fail=1
            airom rules test "$pack" || fail=1
          done < <(find rules eol -name '*.yaml' -not -path '*/testdata/*' | sort)
          exit $fail

      # Pinned, not tracking the corpus's default branch. The corpus is a
      # separate repo with its own cadence; an edit there must not fail a
      # release here, and bumping this SHA is how a corpus change gets adopted
      # deliberately. (airom's ci.yml claimed this pin for months while
      # actually taking HEAD — hence the explicit ref.)
      - name: Fetch the benchmark corpus
        uses: actions/checkout@v7
        with:
          repository: airomhq/airom-bench
          ref: ${{ env.BENCH_CORPUS_SHA }}
          path: .bench-corpus

      # The real gate. Lint proves each pack is well-formed; this proves the
      # ruleset still DETECTS. Merging a pack change auto-publishes a signed
      # bundle that clients install within a day, so this is the last point at
      # which a detection regression can be stopped.
      - name: Benchmark the effective ruleset
        run: .github/scripts/bench_gate.sh .bench-corpus bench/baseline.json

      - name: Determine the next version
        id: ver
        run: |
          override='${{ github.event.inputs.version }}'
          if [ -n "$override" ]; then
            next="$override"
          else
            latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$latest" ]; then
              next="v0.1.0"
            else
              v=${latest#v}; IFS=. read -r maj min pat <<< "$v"
              next="v${maj}.${min}.$((pat + 1))"
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next"

      - name: Build and sign the bundle
        env:
          AIROM_RULES_SIGNING_KEY: ${{ secrets.AIROM_RULES_SIGNING_KEY }}
        # -eol is passed explicitly so the tool fails the release if the
        # directory is gone or empty. Omitting the flag would fall back to a
        # silent "no catalogs", which no client can tell apart from a bundle
        # that never carried any.
        run: go run ./tools/bundle -rules rules -eol eol -version "${{ steps.ver.outputs.version }}" -out dist

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/airom-rules.tar.gz
            dist/manifest.json
            dist/manifest.json.sig
