name: Lint rule packs

# Every pack must pass airom's own validator (the full lint contract + fixture
# coverage) and its fixtures — no reinvented checks. This runs airom itself, so
# the RE2 regex engine and schema exactly match what a scan will enforce.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with release.yml: a PR must be checked by the same airom the
  # release will use, or green here means nothing there.
  #
  # NOT named AIROM_VERSION. airom maps every AIROM_* variable onto a config
  # key and refuses to start on one it does not recognise, so that name made
  # all 69 lint invocations exit with "unknown AIROM_* environment variable(s)
  # for key(s): version". Keep workflow variables out of that namespace.
  PINNED_AIROM_VERSION: "0.4.6"
  BENCH_CORPUS_SHA: "93f1a230b119999190c98a6e9b9a55ea7f199769"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned, and now actually pinned: this comment claimed it while the line
      # below said `pip install airom`, so every run silently tracked the newest
      # release and an airom change could turn an untouched pack red.
      - name: Install airom
        run: pip install "airom==${{ env.PINNED_AIROM_VERSION }}"

      # eol/ is in the same sweep: `airom rules lint` validates a model lifecycle
      # catalog against its own contract, and `rules test` on one is a no-op that
      # says so (a catalog has no fixtures), so both take one loop. A missing
      # eol/ fails here loudly rather than quietly shipping a bundle with no
      # lifecycle data.
      - name: Lint and test every pack and catalog
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r pack; do
            echo "::group::$pack"
            airom rules lint "$pack" || fail=1
            airom rules test "$pack" || fail=1
            echo "::endgroup::"
          done < <(find rules eol -name '*.yaml' -not -path '*/testdata/*' | sort)
          exit $fail

      # Same gate release.yml runs, here so a PR shows the regression before it
      # is merged rather than after the bundle has published. Pinned corpus: an
      # edit in that repo must not turn an unrelated PR here red.
      - name: Fetch the benchmark corpus
        uses: actions/checkout@v7
        with:
          repository: airomhq/airom-bench
          ref: ${{ env.BENCH_CORPUS_SHA }}
          path: .bench-corpus

      - name: Benchmark the effective ruleset
        run: .github/scripts/bench_gate.sh .bench-corpus bench/baseline.json
